<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweden Car 3D</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud-top">
      <div class="brand-area">
        <p class="eyebrow">Sommar i Västergötland</p>
        <h1>Sweden Car 3D</h1>
      </div>
      <div class="stats">
        <span>📍 <strong id="locationName">Ullervad</strong></span>
        <span>🕒 <strong id="clock">Dag 1 · 08:00</strong></span>
        <span>💰 <strong id="money">3000 kr</strong></span>
      </div>
    </div>

    <main class="game-shell">
      <canvas id="gameCanvas"></canvas>

      <div id="message" class="message" aria-live="polite"></div>
      <div id="prompt" class="prompt" aria-live="polite">Gå runt i världen och tryck E.</div>

      <div class="bottom-panel">
        <div>
          <p class="eyebrow">Volvo 945</p>
          <strong id="carStatus">Motorn väntar på delar</strong>
        </div>
        <div>
          <p class="eyebrow">Förråd</p>
          <strong id="inventory">Tomt</strong>
        </div>
        <button id="resetButton" type="button">Börja om</button>
      </div>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
