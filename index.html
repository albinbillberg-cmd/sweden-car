<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweden Car</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Sweden Car</h1>
        <div class="stats">
          <div><span>Pengar</span><strong id="money">3000 kr</strong></div>
          <div><span>Dag</span><strong id="day">1</strong></div>
          <div><span>Tid</span><strong id="time">08:00</strong></div>
          <div><span>Plats</span><strong id="locationName">Ullervad</strong></div>
        </div>

        <div class="panel">
          <h2>Bilstatus</h2>
          <p id="carStatus">Volvo 945: trasig</p>
        </div>

        <div class="panel">
          <h2>Förråd</h2>
          <ul id="inventoryList"></ul>
        </div>
      </aside>

      <main class="main">
        <nav id="locations" class="locations"></nav>
        <section class="actions panel">
          <h2>Åtgärder</h2>
          <div id="actions" class="action-list"></div>
        </section>

        <section class="story panel">
          <h2>Berättelse</h2>
          <div id="storyLog" class="story-log"></div>
        </section>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
